<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management & Live Chat Portal</title>
    <link rel="stylesheet" href="style.css">
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>
    <div id="toast-container" class="toast-container"></div>

    <nav class="navbar">
        <div class="logo">⚡ AdminPortal</div>
        <div class="nav-items">
            <span id="user-status-display">Not Logged In</span>
            <button id="auth-btn" onclick="toggleAuthModal()">Login / Register</button>
        </div>
    </nav>

    <div class="main-container">
        <!-- Auth Modal -->
        <div id="auth-modal" class="modal hidden">
            <div class="modal-content">
                <span class="close-btn" onclick="toggleAuthModal()">&times;</span>
                <h2 id="modal-title">User Sign Up</h2>
                <form id="auth-form" onsubmit="handleAuth(event)">
                    <input type="text" id="user-name" placeholder="Full Name" required>
                    <input type="tel" id="user-phone" placeholder="Phone Number" required>
                    <input type="password" id="user-password" placeholder="Password" required>
                    <button type="submit" class="btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <!-- Admin Dashboard -->
        <div class="dashboard">
            <h1>Admin Management Dashboard</h1>
            
            <div class="grid-layout">
                <!-- User Log & Control Panel -->
                <div class="card">
                    <h2>👥 System Users Log</h2>
                    <div id="users-list" class="users-list">
                        <!-- User cards will render dynamically here -->
                    </div>
                </div>

                <!-- Live Chat Section -->
                <div class="card">
                    <h2>💬 Support Live Chat</h2>
                    <div class="chat-layout">
                        <div id="chat-threads" class="chat-threads">
                            <!-- Chat user list -->
                        </div>
                        <div class="chat-box">
                            <div id="chat-messages" class="chat-messages">
                                <p class="placeholder-text">Select a conversation to start chatting</p>
                            </div>
                            <div class="chat-input-row">
                                <input type="text" id="admin-chat-input" placeholder="Type a response...">
                                <button onclick="sendAdminMessage()" class="btn-primary">Send</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Settings / Firebase Configuration -->
            <div class="card settings-card">
                <h2>⚙️ Cloud Sync & Firebase Settings</h2>
                <form id="firebase-config-form" onsubmit="saveFirebaseConfig(event)">
                    <div class="input-grid">
                        <input type="text" id="fb-apiKey" placeholder="API Key" required>
                        <input type="text" id="fb-authDomain" placeholder="Auth Domain" required>
                        <input type="text" id="fb-databaseURL" placeholder="Database URL" required>
                        <input type="text" id="fb-projectId" placeholder="Project ID" required>
                    </div>
                    <button type="submit" class="btn-accent">Connect Cloud Sync</button>
                </form>
            </div>
        </div>
    </div>

    <!-- User Floating Chat Widget -->
    <div id="user-chat-widget" class="floating-chat-widget">
        <button class="chat-toggle-btn" onclick="toggleUserChat()">💬</button>
        <div id="user-chat-window" class="chat-window hidden">
            <div class="chat-header">
                <span>Customer Support</span>
                <button onclick="toggleUserChat()">✕</button>
            </div>
            <div id="user-chat-messages" class="chat-messages"></div>
            <div class="chat-input-row">
                <input type="text" id="user-chat-input" placeholder="Type your message...">
                <button onclick="sendUserMessage()" class="btn-primary">Send</button>
            </div>
        </div>
    </div>

    <script src="firebase-sync.js"></script>
    <script src="script.js"></script>
</body>
</html>
